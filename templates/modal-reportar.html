<div class="modal-content">
  <div class="modal-header">
    <h2> Reportar publicación</h2>
    <button class="btn-cerrar-modal" onclick="cerrarModal('reportar')"></button>
  </div>
  
  <div class="modal-body">
    
    <div class="advertencia">
      <p>⚠️ Los reportes falsos pueden resultar en la suspensión de tu cuenta. Por favor, úsalo solo si esta publicación viola nuestras normas.</p>
    </div>

    <!-- Motivos del reporte -->
    <div class="form-group">
      <label>¿Por qué quieres reportar esta publicación? *</label>
      <div id="contenedor-motivos" style="display:flex; flex-direction:column; gap:0.8rem; margin-top:0.5rem;">
        <label class="interes-item">
          <input type="radio" name="motivo-reporte" value="spam">
          📢 Spam o publicidad repetitiva
        </label>
        <label class="interes-item">
          <input type="radio" name="motivo-reporte" value="inapropiado">
           Contenido inapropiado o ilegal
        </label>
        <label class="interes-item">
          <input type="radio" name="motivo-reporte" value="fraude">
          ⚠️ Fraude o estafa
        </label>
        <label class="interes-item">
          <input type="radio" name="motivo-reporte" value="no_existe">
          ❌ El producto no existe o ya no está disponible
        </label>
        <label class="interes-item">
          <input type="radio" name="motivo-reporte" value="datos_falsos">
          🎭 Información falsa o engañosa
        </label>
        <label class="interes-item">
          <input type="radio" name="motivo-reporte" value="otro">
          📝 Otro motivo
        </label>
      </div>
    </div>

    <!-- Descripción adicional -->
    <div class="form-group">
      <label for="motivo-reporte-detalle">Detalles adicionales (Opcional)</label>
      <textarea id="motivo-reporte-detalle" placeholder="Cuéntanos más sobre el problema..." style="min-height: 80px;"></textarea>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn-modal btn-modal-cancelar" onclick="cerrarModal('reportar')">Cancelar</button>
    <button class="btn-modal btn-modal-primario" id="btn-enviar-reporte" onclick="enviarReporte()">Enviar reporte</button>
  </div>
</div>

<script>
  // Lógica de UI para este modal
  
  // Cambiar estilo al seleccionar un motivo
  document.querySelectorAll('input[name="motivo-reporte"]').forEach(radio => {
    radio.addEventListener('change', function() {
      document.querySelectorAll('#contenedor-motivos .interes-item').forEach(el => el.classList.remove('seleccionado'));
      this.parentElement.classList.add('seleccionado');
    });
  });

  // Función para enviar el reporte
  function enviarReporte() {
    const motivoSeleccionado = document.querySelector('input[name="motivo-reporte"]:checked');
    const detalles = document.getElementById('motivo-reporte-detalle').value;

    if (!motivoSeleccionado) {
      alert('⚠️ Por favor, selecciona un motivo para el reporte.');
      return;
    }

    console.log('🚩 Reporte enviado:', {
      motivo: motivoSeleccionado.value,
      detalles: detalles
    });

    alert('✅ Gracias por tu reporte. Nuestro equipo lo revisará pronto para mantener la comunidad segura.');
    cerrarModal('reportar');
  }
</script>
