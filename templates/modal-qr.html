<div class="modal-content">
  <div class="modal-header">
    <h2>📱 Código QR de la publicación</h2>
    <button class="btn-cerrar-modal" onclick="cerrarModal('qr')"></button>
  </div>
  
  <div class="modal-body">
    
    <!-- Información de la publicación -->
    <div class="vista-previa-publicacion">
      <h3 id="qr-titulo">Título de la publicación</h3>
      <p id="qr-descripcion" style="color:#7f8c8d; font-size:0.9rem;">Descripción breve...</p>
    </div>

    <!-- Código QR -->
    <div class="contenedor-qr">
      <div id="qr-imagen" class="qr-imagen">
        <!-- Aquí se renderizará el QR dinámicamente -->
        <div style="font-size:8rem; text-align:center;"></div>
      </div>
      <p style="color:#7f8c8d; font-size:0.85rem; margin-top:1rem;">
        Escanea este código con tu cámara para ver la publicación
      </p>
    </div>

    <!-- Enlace directo -->
    <div class="form-group" style="margin-top:1.5rem;">
      <label for="qr-enlace">Enlace directo:</label>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="qr-enlace" readonly style="flex:1; background:#f8f9fa; font-size:0.85rem;">
        <button class="btn-modal btn-modal-primario" style="padding:0.5rem 1rem;" onclick="copiarEnlaceQR()">Copiar</button>
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn-modal btn-modal-cancelar" onclick="cerrarModal('qr')">Cerrar</button>
    <button class="btn-modal btn-modal-primario" onclick="descargarQR()">️ Descargar QR</button>
  </div>
</div>

<script>
  // Variables para almacenar datos de la publicación
  let datosQR = {
    id: '',
    titulo: '',
    descripcion: ''
  };

  // Inicializar el modal con datos de la publicación
  function inicializarModalQR(datos) {
    datosQR = datos;
    
    // Actualizar información
    document.getElementById('qr-titulo').textContent = datos.titulo || 'Título de la publicación';
    document.getElementById('qr-descripcion').textContent = datos.descripcion || 'Descripción...';
    
    // Generar enlace
    const enlace = `https://remarket-db.com/publicacion/${datos.id}`;
    document.getElementById('qr-enlace').value = enlace;
    
    // Generar QR usando servicio gratuito
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(enlace)}`;
    document.getElementById('qr-imagen').innerHTML = `<img src="${qrUrl}" alt="QR de ${datos.titulo}" style="width:200px; height:200px;">`;
    
    console.log('📱 Modal QR inicializado para:', datos.titulo);
  }

  // Copiar enlace al portapapeles
  function copiarEnlaceQR() {
    const input = document.getElementById('qr-enlace');
    input.select();
    input.setSelectionRange(0, 99999);
    
    try {
      document.execCommand('copy');
      alert('✅ Enlace copiado al portapapeles');
    } catch (err) {
      console.error('Error al copiar:', err);
      alert(' No se pudo copiar el enlace');
    }
  }

  // Descargar el QR como imagen
  function descargarQR() {
    const qrImagen = document.querySelector('#qr-imagen img');
    if (!qrImagen) {
      alert(' No hay QR para descargar');
      return;
    }
    
    const enlace = document.createElement('a');
    enlace.href = qrImagen.src;
    enlace.download = `qr-${datosQR.titulo.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase()}.png`;
    enlace.target = '_blank';
    enlace.click();
    
    console.log('⬇️ QR descargado');
  }

  // Exponer función para que modales.js pueda llamarla
  window.inicializarModalQR = inicializarModalQR;
</script>
