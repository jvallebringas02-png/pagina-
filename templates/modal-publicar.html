<div class="modal-content">
  <div class="modal-header">
    <h2>📦 Publicar artículo o servicio</h2>
    <button class="btn-cerrar-modal" onclick="cerrarModal('publicar')"></button>
  </div>
  
  <div class="modal-body">
    
    <!-- Título -->
    <div class="form-group">
      <label for="titulo-publicacion">Título *</label>
      <input type="text" id="titulo-publicacion" placeholder="Ej: Bicicleta urbana en buen estado" maxlength="100">
      <div class="contador-caracteres"><span id="contador-titulo">0</span>/100</div>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label for="descripcion-publicacion">Descripción *</label>
      <textarea id="descripcion-publicacion" placeholder="Describe el estado, detalles y por qué lo publicas..." maxlength="500"></textarea>
      <div class="contador-caracteres"><span id="contador-descripcion">0</span>/500</div>
    </div>

    <!-- Categoría -->
    <div class="form-group">
      <label for="categoria-publicacion">Categoría *</label>
      <select id="categoria-publicacion">
        <option value="">Selecciona una categoría</option>
        <option value="Tecnología">Tecnología</option>
        <option value="Hogar">Hogar</option>
        <option value="Ropa">Ropa</option>
        <option value="Deportes">Deportes</option>
        <option value="Vehículos">Vehículos</option>
        <option value="Agro / Alimentos">Agro / Alimentos</option>
        <option value="Servicios">Servicios</option>
        <option value="Libros">Libros</option>
        <option value="Otros">Otros</option>
      </select>
    </div>

    <!-- Modalidad -->
    <div class="form-group">
      <label>¿Cómo lo publicas? *</label>
      <div class="opciones-modalidad">
        <div class="opcion-modalidad" onclick="seleccionarModalidad(this, 'venta')">
          <div class="icono">💰</div>
          <div>Venta</div>
        </div>
        <div class="opcion-modalidad" onclick="seleccionarModalidad(this, 'trueque')">
          <div class="icono">🔄</div>
          <div>Trueque</div>
        </div>
        <div class="opcion-modalidad" onclick="seleccionarModalidad(this, 'donacion')">
          <div class="icono">🎁</div>
          <div>Donación</div>
        </div>
      </div>
      <input type="hidden" id="modalidad-seleccionada" value="">
    </div>

    <!-- Precio (Solo aparece si es Venta) -->
    <div class="form-group" id="grupo-precio" style="display:none;">
      <label for="precio-publicacion">Precio (S/)</label>
      <input type="number" id="precio-publicacion" placeholder="0.00" min="0" step="0.01">
    </div>

    <!-- Ubicación -->
    <div class="form-group">
      <label for="ubicacion-publicacion">Ubicación *</label>
      <input type="text" id="ubicacion-publicacion" placeholder="Ej: Trujillo, La Libertad">
    </div>

    <!-- Alcance -->
    <div class="form-group">
      <label>Alcance de la publicación *</label>
      <div class="opciones-alcance">
        <div class="opcion-alcance" onclick="seleccionarAlcance(this, 'local')">
          <div class="icono">📍</div>
          <div>Local</div>
        </div>
        <div class="opcion-alcance" onclick="seleccionarAlcance(this, 'regional')">
          <div class="icono">🗺️</div>
          <div>Regional</div>
        </div>
        <div class="opcion-alcance" onclick="seleccionarAlcance(this, 'mundial')">
          <div class="icono">🌎</div>
          <div>Mundial</div>
        </div>
      </div>
      <input type="hidden" id="alcance-seleccionado" value="local">
    </div>

    <!-- Fotos -->
    <div class="form-group">
      <label for="fotos-publicacion">Fotos (Máximo 5)</label>
      <input type="file" id="fotos-publicacion" multiple accept="image/*">
      <p style="font-size:0.8rem; color:#7f8c8d; margin-top:0.3rem;">Formatos: JPG, PNG, WEBP. Máx 5MB por foto.</p>
    </div>

    <!-- Declaración Jurada -->
    <div class="declaracion-jurada">
      <label style="display:flex; align-items:flex-start; gap:0.5rem; cursor:pointer;">
        <input type="checkbox" id="declaracion-jurada-check" style="margin-top:0.2rem;">
        <span style="font-size:0.85rem;">
          Declaro bajo juramento que soy el propietario legítimo del artículo o servicio publicado, que la información es veraz y que no infringe derechos de terceros. Acepto los términos y condiciones de remarket-db.
        </span>
      </label>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn-modal btn-modal-cancelar" onclick="cerrarModal('publicar')">Cancelar</button>
    <button class="btn-modal btn-modal-primario" id="btn-continuar-publicar" onclick="procesarPublicacion()">Publicar ahora</button>
  </div>
</div>

<script>
  // Lógica de UI para este modal
  
  // Contadores de caracteres
  document.getElementById('titulo-publicacion').addEventListener('input', function() {
    document.getElementById('contador-titulo').textContent = this.value.length;
  });

  document.getElementById('descripcion-publicacion').addEventListener('input', function() {
    document.getElementById('contador-descripcion').textContent = this.value.length;
  });

  // Selección de Modalidad
  function seleccionarModalidad(elemento, modalidad) {
    document.querySelectorAll('.opcion-modalidad').forEach(el => el.classList.remove('seleccionada'));
    elemento.classList.add('seleccionada');
    document.getElementById('modalidad-seleccionada').value = modalidad;
    
    // Mostrar/ocultar precio
    const grupoPrecio = document.getElementById('grupo-precio');
    if (modalidad === 'venta') {
      grupoPrecio.style.display = 'block';
    } else {
      grupoPrecio.style.display = 'none';
      document.getElementById('precio-publicacion').value = '';
    }
  }

  // Selección de Alcance
  function seleccionarAlcance(elemento, alcance) {
    document.querySelectorAll('.opcion-alcance').forEach(el => el.classList.remove('seleccionada'));
    elemento.classList.add('seleccionada');
    document.getElementById('alcance-seleccionado').value = alcance;
  }

  // Procesar publicación (placeholder)
  function procesarPublicacion() {
    const check = document.getElementById('declaracion-jurada-check');
    if (!check.checked) {
      alert('⚠️ Debes aceptar la Declaración Jurada para continuar.');
      return;
    }
    alert('✅ Publicación enviada a revisión (Lógica conectada a publicar.js)');
    cerrarModal('publicar');
  }
</script>
